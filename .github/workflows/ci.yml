name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  php:
    name: PHP Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: cd app && composer install --no-progress --prefer-dist

      - name: PHPStan
        run: cd app && vendor/bin/phpstan analyse --level 5
