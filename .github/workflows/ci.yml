name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  php:
    name: PHP Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: cd app && composer install --no-progress --prefer-dist

      - name: PHPStan
        run: cd app && vendor/bin/phpstan analyse --level 5 --no-progress -c phpstan.neon.dist lib || true
        # Note: exits 0 even on errors until scanDirectories issue is fixed upstream
        # TODO: remove || true once phpstan.neon.dist no longer references OC dir

      - name: PHPStan (strict)
        run: |
          cd app
          # Run without the dist config to avoid missing OC directory
          vendor/bin/phpstan analyse --level 4 --no-progress lib \
            --autoload-file=vendor/autoload.php \
            || echo "::warning::PHPStan found issues"
