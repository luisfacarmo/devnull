name: Release to Nextcloud App Store
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: app
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Package app
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          # Copy app to a clean directory named 'devnull'
          rsync -a --exclude='node_modules' --exclude='tests' --exclude='src' \
            --exclude='.gitignore' --exclude='package-lock.json' \
            --exclude='webpack.config.js' --exclude='phpstan.neon.dist' \
            app/ devnull/
          tar -czf "dist/devnull-${VERSION}.tar.gz" devnull/
          rm -rf devnull/

      - name: Sign package
        run: |
          echo "${{ secrets.APP_PRIVATE_KEY }}" > devnull.key
          openssl dgst -sha512 -sign devnull.key \
            "dist/devnull-${{ steps.package.outputs.version }}.tar.gz" | openssl base64 > dist/signature
          rm devnull.key

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Nextcloud App Store
        uses: R0Wi/nextcloud-appstore-push-action@v1
        with:
          app_name: devnull
          appstore_token: ${{ secrets.APPSTORE_TOKEN }}
          download_url: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/devnull-${{ steps.package.outputs.version }}.tar.gz
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
